name: Telemetry API - CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Job de Pruebas Unitarias
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Run Tests
        run: cd src && go test -v ./... || echo "No tests found, skipping"

  # 2. Job de Seguridad (Shift-Left)
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build local image for scanning
        run: docker build -t telemetry-api:local .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'telemetry-api:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 3. Job de Despliegue (Depende de que pasen las pruebas y la seguridad)
  deploy:
    name: Deploy to AWS Serverless
    needs: [test, security-scan] # Se ejecuta SOLO si test y security-scan terminan en verde
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./infrastructure

      # Resolver el ECR previo (manejando el caso de si ya existe con un import defensivo)
      - name: Create or Sync ECR Repository
        run: |
          terraform apply -target=aws_ecr_repository.api_repo -auto-approve || \
          terraform import aws_ecr_repository.api_repo telemetry-api
        working-directory: ./infrastructure

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: telemetry-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Terraform Apply Full Infrastructure
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: terraform apply -auto-approve -var="image_uri=$IMAGE_URI"
        working-directory: ./infrastructure
